name: A11yLens SARIF

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/cli/index.js test/fixtures/angular-app --format sarif --out a11ylens.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: a11ylens.sarif
